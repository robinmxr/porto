<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Robin Islam | Full Stack Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="theme-color" content="#f5f4f0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background decor -->
  <div class="bg-decor" aria-hidden="true">
    <div class="bg-decor__grid"></div>
    <svg class="bg-decor__vitruvian" viewBox="0 0 900 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Outer square -->
      <rect x="90" y="90" width="720" height="720" stroke="currentColor" stroke-width="0.5" opacity="0.12" rx="4"/>
      <!-- Outer circle (inscribed) -->
      <circle cx="450" cy="450" r="360" stroke="currentColor" stroke-width="0.5" opacity="0.14"/>
      <!-- Inner square -->
      <rect x="232" y="232" width="436" height="436" stroke="currentColor" stroke-width="0.5" opacity="0.08" rx="3"/>
      <!-- Inner circle -->
      <circle cx="450" cy="450" r="218" stroke="currentColor" stroke-width="0.4" opacity="0.1"/>
      <!-- Center crosshairs -->
      <line x1="90" y1="450" x2="810" y2="450" stroke="currentColor" stroke-width="0.3" opacity="0.08"/>
      <line x1="450" y1="90" x2="450" y2="810" stroke="currentColor" stroke-width="0.3" opacity="0.08"/>
      <!-- Diagonal lines -->
      <line x1="90" y1="90" x2="810" y2="810" stroke="currentColor" stroke-width="0.3" opacity="0.06"/>
      <line x1="810" y1="90" x2="90" y2="810" stroke="currentColor" stroke-width="0.3" opacity="0.06"/>
      <!-- Small center marker -->
      <circle cx="450" cy="450" r="4" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
    </svg>
    <div class="bg-decor__glow bg-decor__glow--1"></div>
    <div class="bg-decor__glow bg-decor__glow--2"></div>
  </div>

  <app-root></app-root>

  <!-- Custom cursor -->
  <div class="cursor-magnifier" aria-hidden="true">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="17" cy="17" r="11" stroke="currentColor" stroke-width="2.5"/>
      <path d="M25 25l10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="cursor-touch" aria-hidden="true"></div>
  <script>
    (function() {
      var isTouch = 'ontouchstart' in window;
      var magnifier = document.querySelector('.cursor-magnifier');
      var touchCursor = document.querySelector('.cursor-touch');
      if (!magnifier || !touchCursor) return;

      if (isTouch) {
        magnifier.style.display = 'none';

        document.addEventListener('touchstart', function(e) {
          var t = e.touches[0];
          touchCursor.style.transform = 'translate(' + (t.clientX - 25) + 'px,' + (t.clientY - 25) + 'px)';
          touchCursor.classList.remove('is-active');
          void touchCursor.offsetWidth;
          touchCursor.classList.add('is-active');
        });

        document.addEventListener('touchmove', function(e) {
          var t = e.touches[0];
          touchCursor.style.transform = 'translate(' + (t.clientX - 25) + 'px,' + (t.clientY - 25) + 'px)';
        });

        document.addEventListener('touchend', function() {
          touchCursor.classList.remove('is-active');
        });
      } else {
        var ox = -20, oy = -20;
        var interactive = 'a, button, input, select, textarea, [role="button"], [role="link"], .grid-card, .project-card__body, .detail-back, .tag, .btn';

        document.addEventListener('mousemove', function(e) {
          magnifier.style.transform = 'translate(' + (e.clientX + ox) + 'px,' + (e.clientY + oy) + 'px)';
        });

        document.addEventListener('mouseover', function(e) {
          var t = e.target;
          var isClickable = t.matches(interactive) || t.closest(interactive);
          magnifier.classList.toggle('is-hovering', !!isClickable);
        });

        document.addEventListener('mouseleave', function() { magnifier.style.opacity = '0'; });
        document.addEventListener('mouseenter', function() { magnifier.style.opacity = ''; });
      }
    })();
  </script>
</body>
</html>
